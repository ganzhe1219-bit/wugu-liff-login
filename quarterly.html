<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>一般車輛自動檢查表(每季)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 10px; background: #f4f4f9; color: #111; margin: 0; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; font-size: 26px; border-bottom: 3px solid #3498db; padding-bottom: 12px; font-weight: 900;}
    .form-group { margin-bottom: 25px; border-bottom: 1px dashed #ddd; padding-bottom: 15px; }
    label { display: block; margin-bottom: 8px; font-weight: 900; font-size: 22px; line-height: 1.3; color: #000;}
    input[type="text"], select, textarea { width: 100%; padding: 14px; border: 2px solid #aaa; border-radius: 8px; box-sizing: border-box; font-size: 20px; background: #fff;}
    input:read-only { background-color: #e9ecef; color: #333; }
    
    /* 隱藏的措施區塊 */
    .action-box { display: none; margin-top: 15px; background: #fff3cd; padding: 12px; border-radius: 8px; border-left: 5px solid #ffc107; }
    .action-box label { display: inline-block; margin-right: 15px; font-weight: bold; font-size: 18px; color: #856404; margin-top: 5px; cursor: pointer;}
    .action-box input[type="radio"] { width: 20px; height: 20px; vertical-align: middle; margin-right: 5px;}
    
    /* 簽名板 */
    .canvas-container { border: 3px dashed #3498db; border-radius: 8px; background: #fafafa; margin-bottom: 10px; }
    canvas { width: 100%; height: 200px; display: block; touch-action: none; cursor: crosshair; }
    .clear-btn { background: #95a5a6; color: white; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 5px;}
    
    .btn-submit { width: 100%; padding: 20px; background: #3498db; color: white; border: none; border-radius: 10px; font-size: 24px; font-weight: 900; cursor: pointer; margin-top: 10px; }
    #loading { text-align: center; padding: 30px 10px; font-size: 20px; font-weight: bold; }
    .hidden { display: none; }

    /* --- 車況按鈕專屬設計 --- */
    .status-layout { display: flex; gap: 10px; margin-top: 10px; }
    .btn-status { background: white; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; display: flex; align-items: center; justify-content: center;}
    .btn-status.active { color: white; }
    
    /* 左側大按鈕 */
    .btn-main { flex: 2; font-size: 26px; padding: 20px 10px; color: #27ae60; border-color: #27ae60; letter-spacing: 2px;}
    .btn-main.active { background: #27ae60; border-color: #27ae60; }
    
    /* 右側小按鈕群 */
    .side-group { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .btn-side { flex: 1; font-size: 16px; padding: 10px; }
    
    /* 異常與其他按鈕顏色 */
    .btn-sub-1 { color: #e74c3c; border-color: #e74c3c; }
    .btn-sub-1.active { background: #e74c3c; border-color: #e74c3c; }
    .btn-sub-2 { color: #7f8c8d; border-color: #7f8c8d; }
    .btn-sub-2.active { background: #7f8c8d; border-color: #7f8c8d; }
  </style>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div class="container">
    <h2>📋 一般車輛自動檢查表(每季)</h2>
    
    <div id="loading">🔄 正在確認您的 LINE 身分...</div>

    <!-- 第一次登入的註冊畫面 -->
    <div id="registerBox" class="hidden">
      <h3>👋 歡迎使用！請進行初次綁定</h3>
      <p>這是您第一次使用本系統，請輸入您的真實姓名以便日後辨識：</p>
      <div class="form-group" style="text-align: left; margin-top: 15px; border:none;">
        <label for="regName">真實姓名：</label>
        <input type="text" id="regName" placeholder="例如：王小明" required>
        <div style="font-size: 14px; color: #e74c3c; margin-top: 8px;">⚠️ 請務必填寫正確真實姓名，送出後若需修改請洽管理員。</div>
      </div>
      <button type="button" class="btn-submit" style="background:#27ae60;" onclick="submitRegistration()">完成綁定並進入</button>
    </div>

    <form id="checkForm" class="hidden" onsubmit="submitForm(event)">
      <!-- 基本資料 -->
      <div class="form-group">
        <label>檢查人員：</label>
        <input type="text" id="driverName" readonly required>
      </div>
      <div class="form-group">
        <label>車牌號碼：</label>
        <select id="vehicleId" required>
          <option value="">-- 請選擇車輛 --</option>
          <option value="025-BX">025-BX</option>
          <option value="026-BX">026-BX</option>
          <option value="029-BY">029-BY</option>
          <option value="193-BX">193-BX</option>
          <option value="195-BX">195-BX</option>
          <!-- 若有更多車輛請在此處新增 <option> -->
        </select>
      </div>
      
      <!-- 動態產生的檢查項目區塊 -->
      <div id="inspectionItems"></div>

      <!-- 改善措施 -->
      <div class="form-group">
        <label>整體檢查結果採取或建議之改善措施：</label>
        <textarea id="measureNote" rows="3" placeholder="若無特殊狀況可留空..."></textarea>
      </div>

      <!-- 簽名板 -->
      <div class="form-group" style="border: none; padding-bottom: 0;">
        <label>✍️ 檢查人員親筆簽名 (必填)：</label>
        <div class="canvas-container">
          <canvas id="sigCanvas"></canvas>
        </div>
        <button type="button" class="clear-btn" onclick="clearCanvas()">✖ 清除重新簽名</button>
      </div>

      <button type="submit" class="btn-submit">確認送出季檢表</button>
    </form>
  </div>

  <script>
    // 👇👇👇 請務必保持你的 GAS 與 LIFF ID 不變 👇👇👇
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxD4AxVdWSMoFaawgupU2UqXgWr4-Ji1uoaud8U8SIVu-0tet8t2ZSa2Qwwi-T7LSkD/exec"; 
    const LIFF_ID = "2011658008-yf2pn9TM"; 
    
    const itemsData = [
      { id: "item1", name: "1. 胎壓", method: "初步目視、敲打測試", options: ["正常", "過低", "無此項"], trigger: "過低" },
      { id: "item2", name: "2. 輪胎紋路", method: "不得低於 2mm", options: ["正常", "過低", "無此項"], trigger: "過低" },
      { id: "item3", name: "3. 監視主機", method: "畫質、訊號清晰", options: ["正常", "異常", "無此項"], trigger: "異常" },
      { id: "item4", name: "4. 引擎機油液位", method: "量尺上下刻度", options: ["正常", "過低", "無此項"], trigger: "過低" },
      { id: "item5", name: "5. 煞車油液位", method: "量尺上下刻度", options: ["正常", "過低", "無此項"], trigger: "過低" },
      { id: "item6", name: "6. 動力方向機油液位", method: "量尺上下刻度", options: ["正常", "過低", "無此項"], trigger: "過低" },
      { id: "item7", name: "7. 電瓶水液位檢查", method: "量尺上下刻度", options: ["正常", "過低", "無此項"], trigger: "過低" },
      { id: "item8_1", name: "8. 雨刷水", method: "上下限刻度", options: ["正常", "過低", "無此項"], trigger: "過低" },
      { id: "item8_2", name: "8. 水箱水位檢查", method: "量尺上下刻度", options: ["正常", "異常", "無此項"], trigger: "異常" },
      { id: "item9", name: "9. 變速箱、P.T.O(扭力轉換器)、差速器", method: "目視、運轉測試", options: ["正常", "過低", "無此項"], trigger: "過低" },
      { id: "item10", name: "10. 減震鋼板", method: "異常凸起、變形斷裂", options: ["良好", "斷裂", "無此項"], trigger: "斷裂" },
      { id: "item11", name: "11. 附屬設備安全裝置", method: "滅火器、急救箱、安全帶", options: ["正常", "過低", "無此項"], trigger: "過低" },
      { id: "item12", name: "12. 燈光、警示系統", method: "方向燈、遠近光等", options: ["正常", "異常", "無此項"], trigger: "異常" }
    ];

    // 動態產生按鈕版檢查項目
    const container = document.getElementById('inspectionItems');
    itemsData.forEach(item => {
      // 預設將 input 填入第一個選項 (例如: 正常、良好)
      let defaultVal = item.options[0]; 

      let html = `
        <div class="form-group">
          <label>${item.name}</label>
          <div style="margin-bottom: 10px; color: #555; font-size: 16px;">🔍 檢查方法：${item.method}</div>
          
          <!-- 隱藏的輸入框，負責把點選的值存起來送出 -->
          <input type="hidden" id="${item.id}" value="${defaultVal}" required>
          
          <div class="status-layout">
            <button type="button" class="btn-status btn-main active" onclick="setQuarterlyStatus('${item.id}', '${item.options[0]}', '${item.trigger}', this)">✅ ${item.options[0]}</button>
            
            <div class="side-group">
              <button type="button" class="btn-status btn-side btn-sub-1" onclick="setQuarterlyStatus('${item.id}', '${item.options[1]}', '${item.trigger}', this)">🔧 ${item.options[1]}</button>
              <button type="button" class="btn-status btn-side btn-sub-2" onclick="setQuarterlyStatus('${item.id}', '${item.options[2]}', '${item.trigger}', this)">➖ ${item.options[2]}</button>
            </div>
          </div>

          <div id="${item.id}_action" class="action-box">
            <div style="margin-bottom: 8px; font-weight: bold; color: #d35400;">⚠️ 發現異常！請勾選處置方式：</div>
            <label><input type="radio" name="${item.id}_radio" value="自行修復"> 自行修復</label>
            <label><input type="radio" name="${item.id}_radio" value="進廠檢修"> 進廠檢修</label>
          </div>
        </div>`;
      container.innerHTML += html;
    });

    // 處理按鈕點擊與顏色切換邏輯
    window.setQuarterlyStatus = function(id, val, triggerWord, clickedBtn) {
      // 1. 寫入數值
      document.getElementById(id).value = val;
      
      // 2. 切換按鈕亮暗
      const layout = clickedBtn.closest('.status-layout');
      const buttons = layout.querySelectorAll('.btn-status');
      buttons.forEach(btn => btn.classList.remove('active'));
      clickedBtn.classList.add('active');

      // 3. 處理異常措施區塊的顯示與隱藏
      const actionBox = document.getElementById(id + "_action");
      const radios = document.getElementsByName(id + "_radio");
      if (val === triggerWord) {
        actionBox.style.display = "block";
        radios.forEach(r => r.required = true);
      } else {
        actionBox.style.display = "none";
        radios.forEach(r => { r.required = false; r.checked = false; });
      }
    };

    // --- 簽名板功能 ---
    const canvas = document.getElementById('sigCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let hasSigned = false;
    
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = 200;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000';
      hasSigned = false;
    }
    window.addEventListener('resize', resizeCanvas);
    
    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
      }
      return { x: e.offsetX, y: e.offsetY };
    }

    function startDrawing(e) {
      isDrawing = true; hasSigned = true;
      const pos = getCoords(e);
      ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
      e.preventDefault();
    }
    
    function draw(e) {
      if (!isDrawing) return;
      const pos = getCoords(e);
      ctx.lineTo(pos.x, pos.y); ctx.stroke();
      e.preventDefault();
    }
    
    function stopDrawing() { isDrawing = false; ctx.closePath(); }
    
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchcancel', stopDrawing);
    
    window.clearCanvas = function() {
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      hasSigned = false;
    };

    // --- 登入與資料驗證 ---
    let currentUserId = "";

    window.onload = function() {
      resizeCanvas();
      liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          } else {
            liff.getProfile().then(profile => {
              currentUserId = profile.userId;
              checkUserFromGAS(currentUserId);
            });
          }
        }).catch(err => alert("LIFF 錯誤: " + err));
    };

    function checkUserFromGAS(userId) {
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "checkUser", userId: userId })
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('loading').classList.add('hidden');
        if (data.name) {
          document.getElementById('driverName').value = data.name;
          document.getElementById('checkForm').classList.remove('hidden');
        } else {
          document.getElementById('registerBox').classList.remove('hidden');
        }
      })
      .catch(err => alert("網路連線錯誤：" + err));
    }

    function submitRegistration() {
      const name = document.getElementById('regName').value.trim();
      if (!name) {
        alert("請輸入真實姓名！");
        return;
      }

      const btn = event.target;
      btn.disabled = true;
      btn.innerText = '綁定中...';

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "registerUser", userId: currentUserId, name: name })
      })
      .then(response => response.json())
      .then(result => {
        if (result.status === "Success") {
          alert("🎉 綁定成功！");
          document.getElementById('registerBox').classList.add('hidden');
          document.getElementById('driverName').value = name;
          document.getElementById('checkForm').classList.remove('hidden');
        } else {
          alert("綁定失敗：" + result.status);
          btn.disabled = false;
          btn.innerText = '完成綁定並進入';
        }
      })
      .catch(err => {
        alert("連線錯誤：" + err);
        btn.disabled = false;
        btn.innerText = '完成綁定並進入';
      });
    }

    function getCombinedResult(id) {
      const mainResult = document.getElementById(id).value;
      const actionBox = document.getElementById(id + "_action");
      if (actionBox.style.display === "block") {
        const selectedRadio = document.querySelector(`input[name="${id}_radio"]:checked`);
        if (selectedRadio) {
          return mainResult + " (" + selectedRadio.value + ")";
        }
      }
      return mainResult;
    }

    function submitForm(event) {
      event.preventDefault();
      
      const vNo = document.getElementById('vehicleId').value;
      if (!vNo) {
        alert("請選擇車牌號碼！");
        return;
      }

      if (!hasSigned) {
        alert("📝 請在最下方框框內親筆簽名！");
        return;
      }

      const btn = document.querySelector('.btn-submit');
      btn.disabled = true; 
      btn.innerText = "資料上傳中...(含圖片)";

      const formData = {
        driverName: document.getElementById('driverName').value,
        vehicleId: document.getElementById('vehicleId').value,
        item1: getCombinedResult("item1"),
        item2: getCombinedResult("item2"),
        item3: getCombinedResult("item3"),
        item4: getCombinedResult("item4"),
        item5: getCombinedResult("item5"),
        item6: getCombinedResult("item6"),
        item7: getCombinedResult("item7"),
        item8_1: getCombinedResult("item8_1"),
        item8_2: getCombinedResult("item8_2"),
        item9: getCombinedResult("item9"),
        item10: getCombinedResult("item10"),
        item11: getCombinedResult("item11"),
        item12: getCombinedResult("item12"),
        measureNote: document.getElementById('measureNote').value,
        signature: canvas.toDataURL("image/png")
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: "saveQuarterly", data: formData })
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === "Success") {
          alert("✅ 季檢紀錄與簽名已成功送出！");
          liff.closeWindow();
        } else {
          alert("❌ 儲存失敗：" + result.status);
          btn.disabled = false;
          btn.innerText = "確認送出季檢表";
        }
      })
      .catch(err => {
        alert("❌ 送出失敗: " + err.message);
        btn.disabled = false;
        btn.innerText = "確認送出季檢表";
      });
    }
  </script>
</body>
</html>
  </script>
</body>
</html>
