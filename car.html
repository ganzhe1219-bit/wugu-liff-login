<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日車輛作業前自動檢查表</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- 引入 SweetAlert2 彈出視窗套件 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 10px; background: #f4f4f9; color: #111; margin: 0; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; font-size: 28px; border-bottom: 3px solid #3498db; padding-bottom: 12px; font-weight: 900;}
    .form-group { margin-bottom: 28px; }
    
    /* 題目字體放大 */
    label { display: block; margin-bottom: 12px; font-weight: 900; font-size: 32px; line-height: 1.3; color: #000;}
    input, select, textarea { width: 100%; padding: 16px; border: 2px solid #aaa; border-radius: 8px; box-sizing: border-box; font-size: 24px; background: #fff;}
    input:read-only { background-color: #e9ecef; color: #333; }
    
    /* 按鈕排版比例 */
    .btn-group { display: flex; gap: 8px; align-items: stretch; }
    .check-btn { border: 2px solid #aaa; border-radius: 10px; text-align: center; cursor: pointer; font-weight: 900; display: flex; align-items: center; justify-content: center; transition: 0.2s;}
    
    /* 預設的 正常/異常/無此項 比例 */
    .check-btn:nth-child(1) { flex: 3; padding: 16px 5px; font-size: 24px; letter-spacing: 2px; }
    .check-btn:nth-child(2) { flex: 1; padding: 16px 5px; font-size: 20px; }
    .check-btn:nth-child(3) { flex: 1.2; padding: 16px 2px; font-size: 18px; }

    /* 機油專屬的三等分按鈕比例與字體調整 */
    .oil-group .check-btn { flex: 1 !important; font-size: 15px !important; padding: 16px 2px !important; letter-spacing: normal !important; }

    /* 按鈕選中狀態 */
    .check-btn.active.normal { background: #2ecc71; color: white; border-color: #27ae60; }
    .check-btn.active.abnormal { background: #e74c3c; color: white; border-color: #c0392b; }
    .check-btn.active.na { background: #95a5a6; color: white; border-color: #7f8c8d; }
    
    .btn-submit { display: block; width: 100%; padding: 20px; background: #3498db; color: white; border: none; border-radius: 10px; font-size: 26px; font-weight: 900; margin-top: 30px; transition: 0.3s; }
    .btn-submit:disabled { background: #95a5a6; cursor: not-allowed; }
    #loading, #registerBox { text-align: center; padding: 30px 10px; font-size: 24px; font-weight: bold; }
    .hidden { display: none; }

    /* 簽名板專屬設定 */
    #signatureCanvas { border: 3px dashed #3498db; border-radius: 8px; background: #fafafa; width: 100%; height: 250px; cursor: crosshair; touch-action: none; margin-top: 5px; }
    .btn-clear { display: inline-block; padding: 10px 20px; background: #95a5a6; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 10px; width: 100%; }

    /* 放大 SweetAlert2 視窗內的字體 */
    .swal2-title { font-size: 28px !important; }
    .swal2-html-container { font-size: 20px !important; }
    .swal2-confirm { font-size: 20px !important; padding: 12px 24px !important; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🛠️ 車輛作業前自動檢查表</h2>
    
    <div id="loading"><p>🔄 系統載入與身分驗證中...</p></div>
    
    <div id="registerBox" class="hidden">
      <h3>👋 歡迎！初次使用請綁定</h3>
      <div class="form-group" style="text-align: left;">
        <label style="font-size: 24px;">真實姓名：</label>
        <input type="text" id="regName" placeholder="請輸入真實姓名">
      </div>
      <button class="btn-submit" id="btnRegister" onclick="submitRegistration()">完成綁定</button>
    </div>

    <form id="checkForm" class="hidden" onsubmit="submitForm(event)">
      <div class="form-group"><label style="font-size: 24px;">駕駛姓名：</label><input type="text" id="driverName" readonly></div>
      <div class="form-group">
        <label style="font-size: 24px;">車輛類型：</label>
        <select id="vehicleType" onchange="loadVehiclesAndQuestions()" required>
          <option value="">-- 請選擇 --</option>
          <option value="一般車輛">一般車輛</option>
          <option value="抓斗車">抓斗車</option>
          <option value="堆高機">堆高機</option>
          <option value="高空作業車">高空作業車</option>
          <option value="鏟裝機、挖掘機">鏟裝機、挖掘機</option>
        </select>
      </div>
      <div class="form-group">
        <label style="font-size: 24px;">車號 / 機具編號：</label>
        <select id="vehicleNo" required><option value="">-- 先選擇車輛類型 --</option></select>
      </div>

      <div id="questionsArea" class="hidden">
        <div id="dynamicQuestions"></div>
      </div>

      <!-- 永遠顯示的選填措施欄位 -->
      <div class="form-group" id="memoGroup" style="margin-top:20px;">
        <label style="font-size: 24px; color: #2c3e50;">檢查結果採取或建議改善措施：</label>
        <textarea id="note" rows="2" placeholder="無則免填"></textarea>
      </div>

      <!-- 簽名板區塊 -->
      <div class="form-group hidden" id="signatureGroup" style="margin-top:30px;">
        <label style="font-size: 24px;">✍️ 駕駛親筆簽名 (必填)：</label>
        <canvas id="signatureCanvas"></canvas>
        <button type="button" class="btn-clear" onclick="clearCanvas()">✖ 清除重簽</button>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">確認送出</button>
    </form>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxD4AxVdWSMoFaawgupU2UqXgWr4-Ji1uoaud8U8SIVu-0tet8t2ZSa2Qwwi-T7LSkD/exec"; 
    const LIFF_ID = "2011658008-7vfc1d6q"; 
    
    const db = {
      "一般車輛": { cars: ["025-BX","026-BX","029-BY","042-R5","067-TH","095-VK","120-VK","128-BY","1457-L2","193-BX","195-BX","201-BX","225-UY","247-BX","272-BY","286-BY","295-R6","363-BY","4021-T2","4022-T2","4723-K9","412-VK","422-UM","4427-YM","4428-YM","4433-YM","447-R5","4721-K9","477-BX","5502-G3","620-UY","6390-VL","649-SL","650-SL","653-BX","655-BX","677-BX","678-BX","7435-A5","7436-A5","7492-YL","822-TW","8F-9247","9080-RH","9081-RH","912-R7","AAC-298","AAC-791","AKT-2278","ALA-1091","ALA-6913","APG-9263","APK-9072","AXC-1712","AXC-1715","BBN-0971","BBN-0972","BEN-7251","BTB-2892","BTB-2893","BZY-8173","KEC-0719","KEC-0723","KED-0815","KEE-1110","KEG-2050","KEG-2815","KEG-2911","KEJ-3529","KEJ-3697","KEJ-6282","KEL-3996","KEP-7116","KEQ-0239","KEQ-0250","KEQ-0251","KEQ-0252","KEU-3230","KEU-5026","KEU-5231","KEU-5237","KEU-5567","KEU-5569","KEU-5573","KEU-6101","KEV-8665","KEX-0129"], questions: ["引擎機油","儀表操作、指示燈","方向盤","喇叭、車窗試放","監視主機","遠近光燈、煞車燈","前後方向燈","手煞車、腳煞車","後視鏡","雨刷","胎壓、胎紋","輪胎紋路","引擎機油、方向機油、煞車油","油量","電瓶水","水箱冷卻水","擋風玻璃清潔液","★警示旋轉燈、蜂鳴器","★安全護欄","★垃圾壓縮系統","★附設加壓系統"] },
      "抓斗車": { cars: ["KEG-2815","649-SL","912-R7"], questions: ["油壓系統油箱油量正常","油管聯結器等有無漏油","控制裝置運作正常","PTO操作正常","旋轉裝置螺栓是否鬆動、漏油","作業器具安全帽安全帶正常","制提器離合器儀表燈光正常","吊具鋼索有無截斷磨損","★過捲及過負荷預防裝置正常","★防滑舌片裝置正常","未超過額定荷重","警報控制開關器正常"] },
      "堆高機": { cars: ["53","61"], questions: ["靜態試拉手煞車","腳煞車系統動態煞車踏板間隙","檢查液壓管路","試踩離合器","車靜止時試搖排檔桿","連結裝置檢查有無異常","各種儀器檢查有無異常","蓄電池檢查有無異常","配線檢查有無異常","控制裝置檢查有無異常"] },
      "高空作業車": { cars: ["AAC-791"], questions: ["靜態試拉手煞車","檢查腳煞車系統動態","無顯著磨損、剝離、油污","離合器檢查液壓管路","試踩離合器","車靜止時試搖排檔桿","開關或控制器作動狀況正常","各種作業裝備應正常","油箱油量是否正常","配線檢查有無異常"] },
      "鏟裝機、挖掘機": { cars: ["55","56","60","62","挖719"], questions: ["引擎室機油、冷卻水、燃油是否洩漏","冷卻系統是否洩漏及散熱片積泥","末級傳動是否洩漏","鏈輪齒是否磨損","各燈系是否正常","各操作油管及接頭是否正常","煞車制動是否正常","駕駛室清潔與儀錶破損","空氣濾清器運作是否正常","★輪胎氣壓是否充足","風扇皮帶龜裂鬆弛","電瓶液面是否於正常","黃油檢注射斗主梢"] }
    };

    let currentUserId = "";
    let currentAnswers = [];

    let canvas, ctx, isDrawing = false, hasSigned = false;

    window.onload = function() {
      canvas = document.getElementById('signatureCanvas');
      ctx = canvas.getContext('2d');
      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDraw);
      canvas.addEventListener('mouseout', stopDraw);
      canvas.addEventListener('touchstart', startDraw, {passive: false});
      canvas.addEventListener('touchmove', draw, {passive: false});
      canvas.addEventListener('touchend', stopDraw);
      canvas.addEventListener('touchcancel', stopDraw);

      liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true })
        .then(() => {
          if (!liff.isLoggedIn()) { liff.login(); } 
          else {
            liff.getProfile().then(profile => {
              currentUserId = profile.userId;
              checkUserStatus();
            });
          }
        }).catch(err => {
          Swal.fire({ icon: 'error', title: 'LIFF 載入失敗', text: err.toString(), confirmButtonText: '確定' });
        });
    };

    function checkUserStatus() {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 確保跨網域成功
        body: JSON.stringify({ action: "checkUser", userId: currentUserId })
      }).then(res => res.json()).then(data => {
        document.getElementById('loading').classList.add('hidden');
        if (data.name) {
          document.getElementById('driverName').value = data.name;
          document.getElementById('checkForm').classList.remove('hidden');
        } else {
          document.getElementById('registerBox').classList.remove('hidden');
        }
      }).catch(err => {
        Swal.fire({ icon: 'error', title: '連線異常', text: '網路連線錯誤，請重試！', confirmButtonText: '我知道了' });
      });
    }

    function submitRegistration() {
      const nameInput = document.getElementById('regName').value.trim();
      if (!nameInput) {
        Swal.fire({ icon: 'warning', title: '請輸入姓名', text: '必須填寫真實姓名才能開始使用！', confirmButtonText: '確定' });
        return;
      }
      
      const btn = document.getElementById('btnRegister');
      btn.disabled = true;
      btn.innerText = "⏳ 綁定中，請稍候...";
      
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 確保跨網域成功
        body: JSON.stringify({ action: "register", userId: currentUserId, name: nameInput })
      }).then(res => res.json()).then(data => {
        Swal.fire({
          icon: 'success',
          title: '✅ 綁定成功',
          text: `歡迎使用，${nameInput}！`,
          confirmButtonColor: '#3498db',
          confirmButtonText: '開始檢查'
        }).then(() => {
          document.getElementById('registerBox').classList.add('hidden');
          document.getElementById('driverName').value = nameInput;
          document.getElementById('checkForm').classList.remove('hidden');
        });
      }).catch(err => {
        Swal.fire({ icon: 'error', title: '綁定失敗', text: '請檢查網路後再試一次', confirmButtonText: '確定' });
        btn.disabled = false;
        btn.innerText = "完成綁定";
      });
    }

    function loadVehiclesAndQuestions() {
      const type = document.getElementById('vehicleType').value;
      const vSelect = document.getElementById('vehicleNo');
      const qArea = document.getElementById('dynamicQuestions');
      const qWrap = document.getElementById('questionsArea');
      
      vSelect.innerHTML = '<option value="">-- 請選擇 --</option>';
      qArea.innerHTML = '';
      currentAnswers = [];
      document.getElementById('signatureGroup').classList.add('hidden');
      document.getElementById('note').value = '';

      if (!type) { qWrap.classList.add('hidden'); return; }

      const savedData = JSON.parse(localStorage.getItem('savedCheck_' + type)) || {};
      const savedAnswers = savedData.answers || [];
      const savedVehicleNo = savedData.vehicleNo || "";

      db[type].cars.forEach(car => {
        let selected = (car === savedVehicleNo) ? 'selected' : '';
        vSelect.innerHTML += `<option value="${car}" ${selected}>${car}</option>`;
      });
      
      let html = '';
      db[type].questions.forEach((q, idx) => {
        let ans = savedAnswers[idx] || ""; 
        currentAnswers.push(ans); 
        
        html += `<div class="form-group"><label>${idx + 1}. ${q}</label>`;
        
        if(q === "引擎機油") {
          // 👇 將 50~80% 也改為綠色 (active normal)
          let highAct = (ans === '高於80%') ? 'active normal' : '';
          let midAct = (ans === '50~80%') ? 'active normal' : ''; 
          let lowAct = (ans === '50%以下') ? 'active abnormal' : '';

          html += `<div class="btn-group oil-group">
                     <div class="check-btn btn-q${idx} ${highAct}" onclick="setOilAns(${idx}, '高於80%', this)">高於80%</div>
                     <div class="check-btn btn-q${idx} ${midAct}" onclick="setOilAns(${idx}, '50~80%', this)">50~80%</div>
                     <div class="check-btn btn-q${idx} ${lowAct}" onclick="setOilAns(${idx}, '50%以下', this)">50%以下</div>
                   </div>`;
        } else {
          let normAct = (ans === '正常') ? 'active normal' : '';
          let abnAct = (ans === '異常') ? 'active abnormal' : '';
          let naAct = (ans === '無此項') ? 'active na' : '';

          html += `<div class="btn-group">
                     <div class="check-btn btn-q${idx} ${normAct}" onclick="setAns(${idx}, '正常', this)">正常</div>
                     <div class="check-btn btn-q${idx} ${abnAct}" onclick="setAns(${idx}, '異常', this)">異常</div>
                     <div class="check-btn btn-q${idx} ${naAct}" onclick="setAns(${idx}, '無此項', this)">無此項</div>
                   </div>`;
        }
        html += `</div>`;
      });
      
      qArea.innerHTML = html;
      qWrap.classList.remove('hidden');

      document.getElementById('signatureGroup').classList.remove('hidden');
      setTimeout(initCanvas, 100);
    }

    function setOilAns(idx, val, element) {
      updateAns(idx, val);
      document.querySelectorAll('.btn-q' + idx).forEach(btn => btn.classList.remove('active', 'normal', 'abnormal', 'na'));
      
      // 👇 高於80% 與 50~80% 都會顯示綠色
      if(val === '高於80%' || val === '50~80%') element.classList.add('active', 'normal');
      if(val === '50%以下') element.classList.add('active', 'abnormal');
    }

    function setAns(idx, val, element) {
      updateAns(idx, val);
      document.querySelectorAll('.btn-q' + idx).forEach(btn => btn.classList.remove('active', 'normal', 'abnormal', 'na'));
      if(val === '正常') element.classList.add('active', 'normal');
      if(val === '異常') element.classList.add('active', 'abnormal');
      if(val === '無此項') element.classList.add('active', 'na');
    }

    function updateAns(idx, val) {
      currentAnswers[idx] = val;
    }

    function initCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000';
      hasSigned = false;
    }

    function clearCanvas() {
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      hasSigned = false;
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
      }
      return { x: e.offsetX, y: e.offsetY };
    }

    function startDraw(e) {
      isDrawing = true; hasSigned = true;
      const pos = getCoords(e);
      ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
      e.preventDefault(); 
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getCoords(e);
      ctx.lineTo(pos.x, pos.y); ctx.stroke();
      e.preventDefault();
    }

    function stopDraw() { isDrawing = false; ctx.closePath(); }

    function submitForm(event) {
      event.preventDefault();
      const vNo = document.getElementById('vehicleNo').value;
      if (!vNo) {
        Swal.fire({ icon: 'warning', title: '提醒', text: '請選擇車牌號碼！', confirmButtonText: '確定' });
        return;
      }
      if (currentAnswers.includes("")) {
        Swal.fire({ icon: 'warning', title: '提醒', text: '請確認所有檢查項目皆已點選！', confirmButtonText: '確定' });
        return;
      }
      const note = document.getElementById('note').value.trim();
      
      if (!hasSigned) {
        Swal.fire({ icon: 'warning', title: '缺少簽名', text: '📝 請在最下方框框內親筆簽名！', confirmButtonText: '確定' });
        return;
      }

      const btn = document.getElementById('submitBtn');
      
      btn.disabled = true; 
      btn.innerText = '⏳ 資料上傳中，請稍候...';

      const payload = {
        userId: currentUserId, driverName: document.getElementById('driverName').value,
        vehicleType: document.getElementById('vehicleType').value, vehicleNo: vNo,
        answers: currentAnswers, note: note,
        signature: canvas.toDataURL('image/png') 
      };

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 確保跨網域成功
        body: JSON.stringify({ action: "saveData", data: payload })
      }).then(res => res.json()).then(data => {
        localStorage.setItem('savedCheck_' + payload.vehicleType, JSON.stringify({
           vehicleNo: payload.vehicleNo,
           answers: payload.answers
        }));

        Swal.fire({
          icon: 'success',
          title: '✅ 紀錄已送出！',
          text: '您的檢查表與簽名已安全存檔',
          confirmButtonColor: '#27ae60', // 綠色按鈕
          confirmButtonText: '關閉視窗',
          allowOutsideClick: false // 強制使用者點擊按鈕才能關閉
        }).then((result) => {
          if (result.isConfirmed) {
            liff.closeWindow(); // 點擊關閉視窗後自動離開 LINE LIFF
          }
        });

      }).catch(err => {
        Swal.fire({ icon: 'error', title: '❌ 傳送失敗', text: '請檢查網路連線是否正常', confirmButtonText: '確定' });
        btn.disabled = false; 
        btn.innerText = '確認送出';
      });
    }
  </script>
</body>
</html>
