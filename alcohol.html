<!DOCTYPE html>
<html>
<head>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日酒測登記</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; background: #f4f4f9; text-align: center; }
    .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { color: #2c3e50; margin-bottom: 5px; }
    #driverName { font-size: 24px; font-weight: bold; color: #2980b9; margin-bottom: 20px; }
    .btn-pass { display: block; width: 100%; padding: 20px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 22px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
    .btn-fail { display: block; width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px;}
    .btn-cancel { display: block; width: 100%; padding: 15px; background: #7f8c8d; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    
    /* 異常數值輸入框樣式 */
    .input-box { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #e74c3c; border-radius: 8px; font-size: 18px; box-sizing: border-box; text-align: center; }
    
    #loading { color: #666; margin-bottom: 20px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🚓 每日酒測登記</h2>
    <div id="loading">🔄 讀取身分中...</div>
    
    <div id="mainUI" class="hidden">
      <div id="driverName">姓名載入中...</div>
      
      <!-- 第一層：正常/異常 選擇區 -->
      <div id="buttonGroup">
        <button class="btn-pass" onclick="submitPass()">🟢 酒測值為 0</button>
        <button class="btn-fail" onclick="showAbnormalBox()">🔴 含有酒精反應</button>
      </div>

      <!-- 第二層：異常數值填寫區 (預設隱藏) -->
      <div id="abnormalBox" class="hidden">
        <label style="display:block; margin-bottom:10px; font-weight:bold; color:#e74c3c;">請輸入實際酒測數值 (mg/L)：</label>
        <input type="number" id="abnormalValue" class="input-box" step="0.01" placeholder="例如：0.15">
        
        <button class="btn-fail" onclick="submitAbnormal()">⚠️ 確認送出異常紀錄</button>
        <button class="btn-cancel" onclick="cancelAbnormal()">🔙 返回上一步</button>
      </div>
      
    </div>
  </div>

  <script>
    // 你的 GAS 網址與 LIFF ID
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2VQW2KJiSTz-eMA7NeKDh-9n8l5QXzuHy_ul5w9AJwW3oCEmxqhYXvVYC_znHVQeXaw/exec"; 
    const LIFF_ID = "2011658008-PlEdlKp7"; 
    
    let currentUserId = "";
    let currentUserName = "";

    // LIFF 初始化
    window.onload = function() {
      liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            currentUserId = profile.userId;
            currentUserName = profile.displayName;
            document.getElementById('driverName').innerText = "哈囉，" + currentUserName;
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('mainUI').classList.remove('hidden');
          }).catch(err => alert("無法取得 LINE 資料"));
        }
      });
    };

    // 點擊合格：直接送出
    function submitPass() {
      sendDataToGAS('數值為 0 (合格)', '');
    }

    // 點擊異常：切換畫面
    function showAbnormalBox() {
      document.getElementById('buttonGroup').classList.add('hidden');
      document.getElementById('abnormalBox').classList.remove('hidden');
    }

    // 在異常畫面點擊返回
    function cancelAbnormal() {
      document.getElementById('buttonGroup').classList.remove('hidden');
      document.getElementById('abnormalBox').classList.add('hidden');
      document.getElementById('abnormalValue').value = ''; // 清空輸入框
    }

    // 確認送出異常數值
    function submitAbnormal() {
      const numValue = document.getElementById('abnormalValue').value;
      if (!numValue) {
        alert("請輸入酒測數值！");
        return;
      }
      // 將數字打包成備註格式
      const noteString = "數值：" + numValue + " mg/L";
      sendDataToGAS('含有酒精反應 (異常)', noteString);
    }

    // 共用的資料傳送函數
    function sendDataToGAS(resultValue, noteValue) {
      // 鎖定所有按鈕防止重複點擊
      const buttons = document.querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = true);
      document.getElementById('driverName').innerText = "資料傳送中...";

      // 將原本的資料結構加上 note
      const formData = {
        userId: currentUserId,
        driverName: currentUserName,
        result: resultValue,
        note: noteValue // 這裡的 note 會傳遞給你的 GAS
      };

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      })
      .then(() => {
        alert('✅ 酒測紀錄已送出！');
        liff.closeWindow(); // 送出後自動關閉
      })
      .catch(error => {
        alert('❌ 傳送失敗，請檢查網路');
        // 恢復按鈕狀態
        buttons.forEach(btn => btn.disabled = false);
        document.getElementById('driverName').innerText = "哈囉，" + currentUserName;
      });
    }
  </script>
</body>
</html>
