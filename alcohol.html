<!DOCTYPE html>
<html>
<head>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日酒測登記</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; background: #f4f4f9; text-align: center; }
    .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { color: #2c3e50; margin-bottom: 5px; }
    #driverName { font-size: 24px; font-weight: bold; color: #2980b9; margin-bottom: 20px; }
    .btn-pass { display: block; width: 100%; padding: 20px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 22px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
    .btn-fail { display: block; width: 100%; padding: 15px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px;}
    .btn-cancel { display: block; width: 100%; padding: 15px; background: #7f8c8d; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
    
    .input-box { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #e74c3c; border-radius: 8px; font-size: 18px; box-sizing: border-box; text-align: center; }
    
    /* 註冊畫面專用按鈕與輸入框 */
    .reg-input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #3498db; border-radius: 8px; font-size: 18px; box-sizing: border-box; text-align: center; }
    .btn-submit { display: block; width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }

    #loading { color: #666; margin-bottom: 20px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🚓 每日酒測登記</h2>
    <div id="loading">🔄 讀取系統資料中...</div>
    
    <!-- 註冊綁定區塊 -->
    <div id="registerUI" class="hidden">
      <h3 style="color: #3498db;">👋 歡迎！請先綁定姓名</h3>
      <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 15px;">初次使用系統，請輸入您的真實姓名</p>
      <input type="text" id="regNameInput" class="reg-input" placeholder="例如：許哲瑋">
      <button class="btn-submit" onclick="submitRegister()">✅ 確認綁定</button>
    </div>

    <!-- 測量主要畫面 -->
    <div id="mainUI" class="hidden">
      <div id="driverName">姓名載入中...</div>
      
      <div id="buttonGroup">
        <button class="btn-pass" onclick="submitPass()">🟢 酒測值為 0</button>
        <button class="btn-fail" onclick="showAbnormalBox()">🔴 含有酒精反應</button>
      </div>

      <div id="abnormalBox" class="hidden">
        <label style="display:block; margin-bottom:10px; font-weight:bold; color:#e74c3c;">請輸入實際酒測數值 (mg/L)：</label>
        <input type="number" id="abnormalValue" class="input-box" step="0.01" placeholder="例如：0.15">
        <button class="btn-fail" onclick="submitAbnormal()">⚠️ 確認送出異常紀錄</button>
        <button class="btn-cancel" onclick="cancelAbnormal()">🔙 返回上一步</button>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2VQW2KJiSTz-eMA7NeKDh-9n8l5QXzuHy_ul5w9AJwW3oCEmxqhYXvVYC_znHVQeXaw/exec"; 
    const LIFF_ID = "2011658008-PlEdlKp7"; 
    
    let currentUserId = "";
    let currentLineName = "";
    let currentRealName = "";

    window.onload = function() {
      liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            currentUserId = profile.userId;
            currentLineName = profile.displayName;
            checkUserExist(); // 向後台檢查是否綁定過
          });
        }
      });
    };

    // 檢查使用者是否已註冊
    function checkUserExist() {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'check', userId: currentUserId })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('loading').classList.add('hidden');
        if (data.realName && data.realName !== "") {
          // 有找到姓名，直接進入主畫面
          currentRealName = data.realName;
          showMainUI();
        } else {
          // 沒找到姓名，顯示綁定畫面
          document.getElementById('registerUI').classList.remove('hidden');
        }
      })
      .catch(err => {
        alert("連線後台失敗，請重整頁面");
      });
    }

    // 提交註冊綁定
    function submitRegister() {
      const nameInput = document.getElementById('regNameInput').value.trim();
      if (!nameInput) return alert("請輸入真實姓名！");
      
      document.getElementById('registerUI').innerHTML = "<h3>綁定中，請稍候...</h3>";
      
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'register', userId: currentUserId, realName: nameInput })
      })
      .then(res => res.json())
      .then(data => {
        alert("✅ 綁定成功！");
        currentRealName = nameInput;
        document.getElementById('registerUI').classList.add('hidden');
        showMainUI();
      });
    }

    function showMainUI() {
      document.getElementById('driverName').innerText = "哈囉，" + currentRealName;
      document.getElementById('mainUI').classList.remove('hidden');
    }

    function submitPass() {
      sendDataToGAS('數值為 0 (合格)', '');
    }

    function showAbnormalBox() {
      document.getElementById('buttonGroup').classList.add('hidden');
      document.getElementById('abnormalBox').classList.remove('hidden');
    }

    function cancelAbnormal() {
      document.getElementById('buttonGroup').classList.remove('hidden');
      document.getElementById('abnormalBox').classList.add('hidden');
      document.getElementById('abnormalValue').value = ''; 
    }

    function submitAbnormal() {
      const numValue = document.getElementById('abnormalValue').value;
      if (!numValue) return alert("請輸入酒測數值！");
      sendDataToGAS('含有酒精反應 (異常)', "數值：" + numValue + " mg/L");
    }

    function sendDataToGAS(resultValue, noteValue) {
      const buttons = document.querySelectorAll('button');
      buttons.forEach(btn => btn.disabled = true);
      document.getElementById('driverName').innerText = "資料傳送中...";

      const formData = {
        action: 'submit',
        userId: currentUserId,
        driverName: currentRealName,
        lineDisplayName: currentLineName,
        result: resultValue,
        note: noteValue
      };

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(formData)
      })
      .then(res => res.json())
      .then(data => {
        alert('✅ 酒測紀錄已送出！');
        liff.closeWindow(); 
      })
      .catch(error => {
        alert('❌ 傳送失敗，請檢查網路');
        buttons.forEach(btn => btn.disabled = false);
        document.getElementById('driverName').innerText = "哈囉，" + currentRealName;
      });
    }
  </script>
</body>
</html>
