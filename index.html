<!DOCTYPE html>
<html>
<head>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日車輛作業前自動檢查表</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f4f4f9; color: #333; margin: 0; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; font-size: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    input:read-only { background-color: #e9ecef; color: #495057; }
    .btn { display: block; width: 100%; padding: 14px; background: #2ecc71; color: white; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; text-align: center; }
    .btn:disabled { background: #95a5a6; cursor: not-allowed; }
    #loading { text-align: center; padding: 30px; color: #666; }
    .hidden { display: none; }
    .hint { font-size: 13px; color: #27ae60; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🛠️ 每日車輛作業前自動檢查表</h2>
    
    <div id="loading">
      <p>🔄 正在驗證 LINE 身分，請稍候...</p>
    </div>

    <form id="checkForm" class="hidden" onsubmit="submitForm(event)">
      <div class="form-group">
        <label for="driverName">駕駛姓名 (LINE 名稱)：</label>
        <input type="text" id="driverName" readonly required>
        <div class="hint">✨ 系統已記錄您的專屬 LINE ID 作為數位簽章</div>
      </div>

      <div class="form-group">
        <label for="vehicleType">車輛類型：</label>
        <select id="vehicleType" required>
          <option value="">請選擇車輛類型</option>
          <option value="一般車輛">一般車輛</option>
          <option value="堆高機">堆高機</option>
          <option value="高空作業車">高空作業車</option>
          <option value="抓斗車">抓斗車</option>
          <option value="垃圾車">垃圾車</option>
        </select>
      </div>

      <div class="form-group">
        <label for="status">車況檢查結果：</label>
        <select id="status" required>
          <option value="正常">正常</option>
          <option value="異常需修繕">異常需修繕</option>
        </select>
      </div>

      <div class="form-group">
        <label for="note">備註說明：</label>
        <textarea id="note" rows="3" placeholder="若無異常可留空"></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn">確認送出檢查表</button>
    </form>
  </div>

  <script>
    // 👇 請務必將下方引號內的網址，換成你剛剛部署的 GAS 網頁應用程式網址 👇
    const APPS_SCRIPT_URL = "請貼上你的_GAS_部署網址"; 
    
    let currentUserId = "";

    window.onload = function() {
      liff.init({ liffId: "2011658008-7vfc1d6q", withLoginOnExternalBrowser: true })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile().then(profile => {
            currentUserId = profile.userId;
            document.getElementById('driverName').value = profile.displayName; // 自動填入 LINE 暱稱
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('checkForm').classList.remove('hidden');
          }).catch(err => alert("無法取得 LINE 資料：" + err));
        }
      });
    };

    function submitForm(event) {
      event.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = '資料傳送中...';

      // 準備要送進試算表的資料
      const formData = {
        userId: currentUserId,
        driverName: document.getElementById('driverName').value,
        vehicleType: document.getElementById('vehicleType').value,
        status: document.getElementById('status').value,
        note: document.getElementById('note').value
      };

      // 傳送資料到 Google Apps Script
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', // 避免 GitHub 與 Google 之間的跨網域阻擋
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      })
      .then(() => {
        alert('✅ 檢查表已成功送出！');
        document.getElementById('checkForm').reset();
        document.getElementById('driverName').value = liff.getDecodedIDToken().name; // 恢復名字
        btn.disabled = false;
        btn.innerText = '確認送出檢查表';
        liff.closeWindow(); // 送出後自動關閉 LINE 視窗
      })
      .catch(error => {
        alert('❌ 送出失敗，請檢查網路連線');
        btn.disabled = false;
        btn.innerText = '確認送出檢查表';
      });
    }
  </script>
</body>
</html>
