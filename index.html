<!DOCTYPE html>
<html>
<head>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日車輛作業前自動檢查表</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #f4f4f9; color: #333; margin: 0; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; font-size: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    input:read-only { background-color: #e9ecef; color: #495057; }
    .btn { display: block; width: 100%; padding: 14px; background: #2ecc71; color: white; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; text-align: center; }
    .btn:active { background: #27ae60; }
    #loading, #registerBox { text-align: center; padding: 30px; color: #666; }
    .hidden { display: none; }
    .hint { font-size: 13px; color: #e74c3c; margin-top: 6px; }
  </style>
  <!-- 引入 LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/v2/2.1/liff.js"></script>
</head>
<body>
  <div class="container">
    <h2>🛠️ 每日車輛作業前自動檢查表</h2>
    
    <!-- 載入中畫面 -->
    <div id="loading">
      <p>正在確認您的 LINE 身分，請稍候...</p>
    </div>

    <!-- 第一次登入的註冊畫面 -->
    <div id="registerBox" class="hidden">
      <h3>👋 歡迎使用！請進行初次綁定</h3>
      <p>這是您第一次使用本系統，請輸入您的真實姓名以便日後辨識：</p>
      <div class="form-group" style="text-align: left; margin-top: 15px;">
        <label for="regName">真實姓名：</label>
        <input type="text" id="regName" placeholder="例如：許哲瑋" required>
        <div class="hint">⚠️ 請務必填寫正確真實姓名，送出後若需修改請洽管理員。</div>
      </div>
      <button type="button" class="btn" onclick="submitRegistration()">完成綁定並進入</button>
    </div>

    <!-- 正式填寫表單 -->
    <form id="checkForm" class="hidden" onsubmit="submitForm(event)">
      
      <div class="form-group">
        <label for="driverName">駕駛姓名：</label>
        <input type="text" id="driverName" readonly required>
        <div class="hint" style="color: #27ae60;">✨ 已自動透過 LINE 識別您的身分</div>
      </div>

      <div class="form-group">
        <label for="vehicleType">車輛類型：</label>
        <select id="vehicleType" required>
          <option value="">請選擇車輛類型</option>
          <option value="一般車輛">一般車輛</option>
          <option value="堆高機">堆高機</option>
          <option value="高空作業車">高空作業車</option>
          <option value="抓斗車">抓斗車</option>
          <option value="垃圾車">垃圾車</option>
        </select>
      </div>

      <div class="form-group">
        <label for="status">車況檢查結果：</label>
        <select id="status" required>
          <option value="正常">正常</option>
          <option value="異常需修繕">異常需修繕</option>
        </select>
      </div>

      <div class="form-group">
        <label for="note">備註說明：</label>
        <textarea id="note" rows="3" placeholder="若無異常可留空"></textarea>
      </div>

      <button type="submit" class="btn">確認送出檢查表</button>
    </form>
  </div>

  <script>
    let currentUserId = "";

  window.onload = function() {
  try {
    alert("1. 準備開始...");

    if (typeof liff === 'undefined') {
      alert("❌ 嚴重錯誤：找不到 LIFF SDK！請確認 <head> 區塊內有引入 line-sdk 的網址。");
      return;
    }

    liff.init({ liffId: "2011658008-7vfc1d6q" })
      .then(() => alert("2. LIFF 初始化成功！"))
      .catch(err => alert("❌ LIFF 初始化失敗: " + JSON.stringify(err)));

  } catch (e) {
    alert("❌ 程式執行崩潰: " + e.message);
  }
  // 加上 { withLoginOnExternalBrowser: true } 讓它在特殊環境下能彈性處理
liff.init({ 
  liffId: "2011658008-7vfc1d6q",
  withLoginOnExternalBrowser: true 
})
.then(() => {
  alert("2. LIFF 初始化成功！");
})
};

    // 檢查後台名冊有沒有這個 LINE ID
    function checkUserRegistered(userId) {
      google.script.run
        .withSuccessHandler(function(name) {
          document.getElementById('loading').classList.add('hidden');
          if (name) {
            // 已經註冊過，直接帶入名字並顯示主表單
            document.getElementById('driverName').value = name;
            document.getElementById('checkForm').classList.remove('hidden');
          } else {
            // 沒註冊過，跳出綁定畫面
            document.getElementById('registerBox').classList.remove('hidden');
          }
        })
        .checkUser(userId);
    }

    // 執行初次註冊綁定
    function submitRegistration() {
      const name = document.getElementById('regName').value.trim();
      if (!name) {
        alert("請輸入真實姓名！");
        return;
      }

      const btn = event.target;
      btn.disabled = true;
      btn.innerText = '綁定中...';

      google.script.run
        .withSuccessHandler(function(res) {
          if (res === "Success") {
            alert("🎉 綁定成功！");
            document.getElementById('registerBox').classList.add('hidden');
            document.getElementById('driverName').value = name;
            document.getElementById('checkForm').classList.remove('hidden');
          } else {
            alert("綁定失敗，請重試。");
            btn.disabled = false;
            btn.innerText = '完成綁定並進入';
          }
        })
        .registerUser(currentUserId, name);
    }

    // 送出檢查表
    function submitForm(event) {
      event.preventDefault();
      
      const data = {
        driverName: document.getElementById('driverName').value,
        vehicleType: document.getElementById('vehicleType').value,
        status: document.getElementById('status').value,
        note: document.getElementById('note').value
      };

      const btn = document.querySelector('#checkForm .btn');
      btn.disabled = true;
      btn.innerText = '資料送出中...';

      google.script.run
        .withSuccessHandler(function(response) {
          alert('✅ 檢查表已成功送出！');
          document.getElementById('checkForm').reset();
          // 重新帶入已綁定的名字
          checkUserRegistered(currentUserId);
          btn.disabled = false;
          btn.innerText = '確認送出檢查表';
        })
        .withFailureHandler(function(error) {
          alert('❌ 送出失敗：' + error.message);
          btn.disabled = false;
          btn.innerText = '確認送出檢查表';
        })
        .saveCheckData(data);
    }
  </script>
</body>
</html>
